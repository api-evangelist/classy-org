description: >-
  FinOps view of Classy (transitioning to GoFundMe Pro) spend from a
  nonprofit customer's perspective. Cost has two layers: a subscription
  layer (Essentials is $0/month for nonprofits under $1M in annual revenue;
  Custom is a negotiated annual/monthly fee for larger nonprofits) and a
  usage layer driven by donation volume - GoFundMe Pay processing fees plus
  a platform fee charged per transaction, alongside optional paid add-ons
  (Giving Cart, Live Events, Salesforce/CRM integrations, connected
  accounts). The api.classy.org/2.0 API itself carries no separate metered
  charge; it is bundled access included with the subscription, used to
  automate data that would otherwise be pulled through the Classy/GoFundMe
  Pro admin console.
notes: >-
  Per-unit platform and processing fee rates are contract-specific and not
  published as a flat percentage; verify current rates on the GoFundMe Pro
  pricing page and in your organization's agreement during reconciliation.
