meters:
- name: subscription_fee
  description: Monthly/annual platform subscription (Essentials is $0; Custom is negotiated).
  unit: accounts
  aggregation: sum
  dimensions:
  - organization
  - plan_tier
- name: transaction_volume
  description: Gross donation/ticket/merchandise volume processed through Classy/GoFundMe Pay, the base for platform and processing fees.
  unit: USD
  aggregation: sum
  dimensions:
  - organization
  - campaign
  - designation
- name: platform_fee
  description: Per-transaction platform fee charged on top of payment processing, contract-dependent rate.
  unit: USD
  aggregation: sum
  dimensions:
  - organization
  - campaign
- name: add_on_fees
  description: Optional paid add-ons (Giving Cart, Live Events, Salesforce/CRM integrations, connected accounts).
  unit: USD
  aggregation: sum
  dimensions:
  - organization
  - add_on
principles:
- name: Visibility
  description: Track gross transaction volume, platform fees, and processing fees per campaign/designation using the Transactions and Designations APIs, rather than relying solely on the admin console.
- name: Allocation
  description: Use campaign and designation IDs to map donation revenue and associated fees back to programs and cost centers.
- name: Optimization
  description: Consolidate onto a single plan tier appropriate to revenue size, review whether paid add-ons (Giving Cart, Live Events) are justified by usage, and reconcile processing fees against negotiated contract rates.
- name: Accountability
  description: Assign a development/finance owner to review the monthly subscription, add-on, and per-transaction fee lines, especially through the 2025-2026 GoFundMe Pro rebrand and any contract renegotiation.
