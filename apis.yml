aid: classy-org
url: https://raw.githubusercontent.com/api-evangelist/classy-org/refs/heads/main/apis.yml
name: Classy
kind: company
description: Classy is an online fundraising platform for nonprofits - donation
  forms, peer-to-peer campaigns, crowdfunding, and event/ticketing pages - built
  around Organizations, Campaigns, Fundraising Pages, Fundraising Teams, Transactions,
  Recurring Donation Plans, Members, Supporters, and Designations. GoFundMe acquired
  Classy in 2022 and announced in 2025 that the Classy product and brand are being
  folded into GoFundMe Pro; the Classy name is being retired through 2026 while
  the underlying software, the api.classy.org/2.0 REST API, and the developer
  docs (developers.classy.org, now redirecting to developers.gofundme.com/pro)
  continue to operate under the GoFundMe Pro banner.
