    - GET    https://api.classy.org/2.0/fundraising-teams/{id}?with=source_tracking_codes
    - PUT    https://api.classy.org/2.0/fundraising-teams/{id}
    - DELETE https://api.classy.org/2.0/fundraising-teams/{id}
    - GET    https://api.classy.org/2.0/transactions/{id}?with=items
    - PUT    https://api.classy.org/2.0/transactions/{id}
    - GET    https://api.classy.org/2.0/recurring-donation-plans/{id}
    - GET    https://api.classy.org/2.0/recurring-donation-plans/{id}/transactions?with=items
    - GET    https://api.classy.org/2.0/members/{id}
    - GET    https://api.classy.org/2.0/supporters/{id}
    - PUT    https://api.classy.org/2.0/supporters/{id}
    - GET    https://api.classy.org/2.0/designations/{id}
    - PUT    https://api.classy.org/2.0/designations/{id}
  endpointsModeled: |
    Request and response field shapes (Transaction, TransactionItem,
    Campaign, FundraisingPage, FundraisingTeam, SourceTrackingCode,
    Organization, Member, Supporter, Designation, RecurringDonationPlan)
    are modeled in openapi/classy-org-openapi.yml from the official
    classy-org/postman-collections example bodies and the classy-node
    resources.json path map, since Classy does not publish a
    machine-readable OpenAPI/Swagger document of its own. The broader
    resource surface (52+ resource types recorded in classy-node, including
    Assets, Blocks, Ecards, Groups, Messages, Posts, Workflows, and more)
    exists but is not individually modeled here; only the nine logical APIs
    most relevant to donor/campaign data (Organizations, Campaigns,
    Fundraising Pages, Fundraising Teams, Transactions, Recurring Donation
    Plans, Members, Supporters, Designations) are covered.
sources:
  - url: https://developers.classy.org/overview/authentication
    type: Documentation
    note: Redirects to developers.gofundme.com/pro/overview/authentication; confirms OAuth2 client_credentials flow and Bearer token usage.
  - url: https://github.com/classy-org/postman-collections
    type: SourceCode
    note: Official Classy/GoFundMe Pro Postman collections (Authentication, Bulk Offline Donations, Fetch Source Codes, Fetch Multi-Item Order) - source of confirmed endpoints and example payloads, including x-kong-limit/x-kong-proxy-latency response headers.
  - url: https://github.com/classy-org/classy-node
    type: SourceCode
    note: Official Node.js SDK; src/resources.json enumerates 52 resource types with their REST paths and supported methods.
  - url: https://github.com/classy-org
    type: SourceCode
    note: Official Classy GitHub organization - SDKs, sample apps, and Postman collections; no webhook or WebSocket related repository present.
  - url: https://support.classy.org/s/article/intro-to-the-classy-api
    type: Documentation
    note: Redirects to prosupport.gofundme.com; how to obtain client_id/client_secret, referenced by the official Postman collections.
  - url: https://pro.gofundme.com/c/pricing/
    type: Documentation
    note: Essentials (free, <$1M revenue) vs Custom (contact sales, >$1M revenue) plan tiers; API access bundled with subscription.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and no webhook/event-subscription
    resource exists either. Classy's own public API is entirely
    request/response REST (api.classy.org/2.0) behind an OAuth2
    client_credentials Bearer token. No AsyncAPI document was created
    because there is no server-push or streaming transport on Classy's own
    API to model.
