    - GET    https://api.classy.org/2.0/organizations/{id}/designations
    - GET    https://api.classy.org/2.0/organizations/{id}/fundraising-pages
    - GET    https://api.classy.org/2.0/organizations/{id}/supporters
    - GET    https://api.classy.org/2.0/organizations/{id}/transactions?with=items
    - GET    https://api.classy.org/2.0/organizations/{id}/recurring-donation-plans
    - GET    https://api.classy.org/2.0/organizations/{id}/source-tracking-codes
    - GET    https://api.classy.org/2.0/campaigns/{id}
    - PUT    https://api.classy.org/2.0/campaigns/{id}
    - GET    https://api.classy.org/2.0/campaigns/{id}/overview
    - POST   https://api.classy.org/2.0/campaigns/{id}/publish
    - POST   https://api.classy.org/2.0/campaigns/{id}/unpublish
    - POST   https://api.classy.org/2.0/campaigns/{id}/deactivate
    - GET    https://api.classy.org/2.0/campaigns/{id}/fundraising-pages
    - GET    https://api.classy.org/2.0/campaigns/{id}/fundraising-teams
    - GET    https://api.classy.org/2.0/campaigns/{id}/transactions?with=items
    - POST   https://api.classy.org/2.0/campaigns/{id}/transactions
    - GET    https://api.classy.org/2.0/campaigns/{id}/source-tracking-codes
