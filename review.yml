aid: classy-org
name: Classy
review:
  question: Does Classy expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Classy's public developer surface
    (api.classy.org/2.0) is request/response REST over HTTPS - there is no
    server-push transport (WebSocket or SSE) documented anywhere in the
    Classy/GoFundMe Pro developer docs, the official classy-org GitHub
    organization's SDKs (classy-node, classy-api-client, classy-php-sdk),
    or the official classy-org/postman-collections examples. Classy also
    does not publish a documented public webhooks resource (no
    subscribe/register-endpoint pattern was found in the API's resource
    map); the closest adjacent resource, OrganizationNotifications, governs
    account notification settings rather than outbound event delivery.
    Real-time attribution instead runs through polling patterns (source
    tracking codes, transaction/overview lookups) built on top of the REST
    API.
findings:
  summary: |
    Classy does not publish a documented public WebSocket API, and it does
    not publish a documented public webhooks/event-subscription API either.
    Classy is an online fundraising platform for nonprofits (donation
    forms, peer-to-peer campaigns, crowdfunding, ticketed events), acquired
    by GoFundMe in 2022 and being folded into the GoFundMe Pro brand
    starting in 2025-2026. Its public API lives at
    https://api.classy.org/2.0, authenticated with an OAuth2
    client_credentials Bearer token obtained from POST /oauth2/auth (JSON
    body: client_id, client_secret, grant_type). Every documented resource
    - Organizations, Campaigns, Fundraising Pages, Fundraising Teams,
    Transactions, Recurring Donation Plans, Members, Supporters,
    Designations, and 40+ others per the official classy-node SDK's
    resource map - is exposed as plain request/response REST with a
    Laravel-style pagination envelope. No realtime, bidirectional, or
    streaming WebSocket (ws:// or wss://) endpoint, and no outbound
    webhook/event-subscription resource, is documented on Classy's own
    public API as of the review date.
  openSource: |
    Classy's public API itself is closed/proprietary and requires a paid
    Classy/GoFundMe Pro account to obtain client credentials. Classy
    publishes open-source client SDKs and sample apps under the
    github.com/classy-org organization (classy-node, classy-php-sdk,
    classy-api-client, classy-angular, custom-leaderboard-sample-app,
    custom-progress-bar-sample-app, postman-collections), which is where
    the confirmed endpoint and payload shapes for this review came from.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.classy.org/2.0
      documented: true
      note: The entire public Classy API surface - Organizations, Campaigns, Fundraising Pages, Transactions, Recurring Donation Plans, Members, Supporters, Designations, and more.
    - protocol: OAuth2
      scheme: https
      documented: true
      note: Token endpoint at https://api.classy.org/oauth2/auth (client_credentials grant, JSON body); Bearer token used on all subsequent REST calls.
    - protocol: Webhook
      scheme: https
      documented: false
      note: No outbound webhook/event-subscription resource is documented in the Classy resource map or SDKs; OrganizationNotifications governs notification settings, not event delivery.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Classy's API reference, SDKs, or Postman collections as of the review date.
  endpointsConfirmed:
    - POST   https://api.classy.org/oauth2/auth
    - GET    https://api.classy.org/2.0/organizations/{id}
